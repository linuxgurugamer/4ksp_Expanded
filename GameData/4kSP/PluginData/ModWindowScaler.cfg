// 4kSP Mod Window Scaler - configuration
//
// Scales third-party mod IMGUI (OnGUI) windows - MechJeb, [x] Science!,
// WaypointManager, AtmosphereAutopilot, ResearchBodies, PartInfo, and
// similar - that don't follow the stock UI Scale setting. This is separate
// from the map icon scaling already provided by 4kSP itself: that one
// covers vessel/waypoint/body markers in map view, this one covers
// third-party mod windows anywhere in the game.
//
// All the keys below are also editable from the "Mod Window Scaling" tab
// of the in-game "4kSP Scaler" toolbar button, including exclude (its
// "Detected mod windows" list shows every mod seen opening a window, with
// a checkbox to exclude it) - this file is fully rewritten on Save from
// there, so hand edits made here survive only until the next time you hit
// Save in that window. A custom per-mod scale (OVERRIDE, as opposed to a
// plain exclude) is still cfg-only, edit it here.

MODWINDOWSCALER
{
	enabled = True
	useStockUIScale = True
	scale = 1.5
	keepOnScreen = True
	logWindows = False

	// Per-mod scale overrides (wins over "scale" / stock UI Scale for that
	// assembly). Find the assembly name either in the in-game "Detected
	// mod windows" list, or by turning logWindows on above, opening the
	// mod's window once, and checking KSP.log for a line like:
	//   [4kSP-ModWindows] window from assembly 'WaypointManager' (requested scale: 1.5)
	//
	// OVERRIDE
	// {
	//	assembly = WaypointManager
	//	scale = 1.75
	// }

	// Shortcut for OVERRIDE { scale = 1 } - excludes a mod entirely (its
	// windows already scale themselves, or don't play well with a global
	// scale). One line per assembly. Same effect as checking "Exclude" in
	// the in-game "Detected mod windows" list.
	//
	// exclude = SCANsat
}
